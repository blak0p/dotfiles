# Lock screen: "Glass card" (design/lockscreen/03-glass-card.html).
# One centered card holds clock, date, user, password and status; the wallpaper stays sharp.
# Positions are offsets from the screen center (y grows upward); the card spans y = +270..-270.

source=~/.config/hypr/hyprlock/colors.conf
# Wallpaper colors from sky_theme.py; hyprlock ignores it when missing.
source=~/.local/state/sky/hyprlock.conf
# Lock image from sky_wallpaper.py (overrides colors.conf); ignored when missing.
source=~/.local/state/sky/hyprlock-background.conf


general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.2, 0.9, 0.25, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    color = rgba(05070bff)
    path = $background_image
    blur_passes = 0
}

# --- Card ---------------------------------------------------------------

shape {
    monitor =
    size = 560, 540
    color = $card_color
    rounding = 36
    border_size = 1
    border_color = $card_border_color
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000077)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 104
    font_family = $font_family_clock
    position = 0, 150
    halign = center
    valign = center
    zindex = 1
}

label { # Date
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $muted_color
    font_size = 18
    font_family = $font_family
    position = 0, 72
    halign = center
    valign = center
    zindex = 1
}

shape { # Separator, edge to edge
    monitor =
    size = 560, 1
    color = $card_border_color
    rounding = 0
    position = 0, 34
    halign = center
    valign = center
    zindex = 1
}

# --- User ---------------------------------------------------------------

shape { # Avatar
    monitor =
    size = 48, 48
    color = $accent_color
    rounding = -1
    position = -58, -12
    halign = center
    valign = center
    zindex = 1
}

label { # Avatar initial
    monitor =
    text = cmd[] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = $on_accent_color
    font_size = 18
    font_family = $font_family
    position = -58, -12
    halign = center
    valign = center
    zindex = 2
}

label { # User name
    monitor =
    text = $USER
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 24, -12
    halign = center
    valign = center
    zindex = 1
}

# --- Password -----------------------------------------------------------

input-field {
    monitor =
    size = 432, 54
    rounding = 16
    outline_thickness = 2
    outer_color = $field_color
    inner_color = $field_color
    font_color = $entry_color
    check_color = $accent_color
    fail_color = rgba(ffb4abff)
    capslock_color = rgba(f5d38aff)
    font_family = $font_family
    placeholder_text = Password
    fail_text = Wrong password · attempt $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -90
    halign = center
    valign = center
    zindex = 1
}

label { # Caps Lock warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(f5d38aff)
    font_size = 14
    font_family = $font_family
    position = 0, -142
    halign = center
    valign = center
    zindex = 1
}

label { # Status chips: layout, network, battery
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $muted_color
    font_size = 13
    font_family = $font_family
    position = 0, -205
    halign = center
    valign = center
    zindex = 1
}

# --- Now playing --------------------------------------------------------

label {
    monitor =
    text = cmd[update:2000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/media.sh
    color = $muted_color
    font_size = 15
    font_family = $font_family
    position = 0, 56
    halign = center
    valign = bottom
    zindex = 1
}
