# starship.toml — dotfiles-shell's prompt config
#
# Original upstream: https://github.com/Gentleman-Programming/Gentleman.Dots
# The palette name 'ii' and the overall styling are inspired by
# Gentleman.Dots' Hyprland preset. This file is a minimal rewrite
# that keeps only the modules actually used here.
#
# Layout (left to right):
#   <username>@  <directory>  <git_branch><git_status>  <cmd_duration>
#   <󱗞 >
#
# The 󱗞 character is a Nerd Font glyph (white heavy check mark). It
# requires a Nerd Font in your terminal to render correctly. Change
# to ●, ➜, or ❯ in the [character] section if you prefer something
# else.

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration
$character"""

add_newline = true
command_timeout = 1000
palette = "ii"

# ─── Character ─────────────────────────────────────────────────
[character]
success_symbol = "[❯](fg:green bold) "
error_symbol = "[❯](fg:red bold) "

# ─── OS (disabled — uses Nerd Font glyphs that not all fonts have) ─
[os]
disabled = true

# ─── Username (only on remote or non-default user) ──────────────
[username]
show_always = false
format = "[$user]($style)@"
style_user = "blue"
style_root = "red bold"

# ─── Directory ─────────────────────────────────────────────────
[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
truncation_length = 5
truncation_symbol = "…/"
style = "fg:blue bold"
read_only_style = "fg:red"
read_only = " 󰌾 "
truncate_to_repo = false

# ─── Git ──────────────────────────────────────────────────────
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "fg:mauve bold"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:red"
modified = "!"
staged = "+"
untracked = "?"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

# ─── Command duration (only when > 2s) ────────────────────────
[cmd_duration]
format = "[$duration]($style) "
style = "fg:yellow"
min_time = 2_000

# ─── Time (right-aligned via $fill) ───────────────────────────
[time]
disabled = false
format = "[$time]($style) "
time_format = "%R"
style = "fg:subtext1"

# ─── Palette (ANSI names: follows the wallpaper via kitty) ───────────────────────────
[palettes.ii]
text          = "bright-white"
subtext0      = "bright-black"
subtext1      = "white"
overlay0      = "bright-black"
overlay1      = "bright-black"
overlay2      = "black"
surface0      = "black"
surface1      = "black"
surface2      = "black"
base          = "black"
mantle        = "black"
crust         = "black"

blue          = "blue"
mauve         = "purple"
purple        = "purple"
lavender      = "bright-blue"
pink          = "bright-purple"
green         = "green"
red           = "red"
yellow        = "yellow"
orange        = "bright-yellow"
peach         = "bright-yellow"
teal          = "cyan"
cyan          = "cyan"
sapphire      = "bright-blue"
sky           = "bright-cyan"
rosewater     = "bright-white"
flamingo      = "bright-red"
maroon        = "red"
maroon_dark   = "red"
