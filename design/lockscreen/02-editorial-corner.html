<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=2560">
<title>Editorial corner</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--on:#dfe3e7;--muted:#a3adb6;--accent:#8fcff3;--err:#ffb4ab;--warn:#f5d38a;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{width:2560px;height:1440px;overflow:hidden;background:#05070b;color:var(--on)}
main{position:relative;width:2560px;height:1440px;isolation:isolate}
/* Wallpaper stays sharp; only a bottom-left scrim for legibility */
.wall{position:absolute;inset:0;z-index:-2;background:
 radial-gradient(55% 40% at 58% 92%,hsl(205 80% 40%/.65),transparent 70%),
 linear-gradient(180deg,hsl(215 45% 6%),hsl(212 40% 11%) 55%,hsl(200 60% 20%))}
.wall::after{content:"";position:absolute;left:61%;top:0;width:60px;height:100%;background:linear-gradient(90deg,transparent,hsl(200 80% 80%/.5),transparent);filter:blur(10px)}
.scrim{position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 80% at 0% 100%,rgba(5,7,11,.85),transparent 70%)}
.block{position:absolute;left:120px;bottom:120px}
.time{font-size:260px;font-weight:800;line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.date{font-size:34px;font-weight:600;margin:28px 0 6px}
.date span{color:var(--accent)}
.sub{font-size:20px;color:var(--muted);margin-bottom:48px}
.row{display:flex;align-items:center;gap:16px}
.field{width:420px;height:52px;border-bottom:2px solid rgba(223,227,231,.35);display:flex;align-items:center;gap:10px;padding:0 4px;transition:border-color .2s}
.field .ph{color:var(--muted);font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--on)}
.who{font-size:16px;color:var(--muted)}
.hint{height:24px;margin-top:12px;font-size:16px;font-weight:500}
[data-s=typing] .field{border-color:var(--accent)}
[data-s=wrong] .field{border-color:var(--err);animation:shake .35s}
[data-s=wrong] .hint{color:var(--err)}
[data-s=caps] .hint{color:var(--warn)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.status{position:absolute;top:56px;right:64px;text-align:right;display:flex;flex-direction:column;gap:10px;font-size:17px;color:var(--muted)}
.status b{color:var(--on);font-weight:600}
.media{position:absolute;right:64px;bottom:120px;width:420px;padding:20px 22px;border-radius:22px;background:rgba(15,20,23,.55);backdrop-filter:blur(12px);display:flex;gap:18px;align-items:center}
.art{width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,#3b2a1e,#c98b5a)}
.media .t{font-size:18px;font-weight:600}.media .a{font-size:15px;color:var(--muted);margin-top:4px}
.states{position:absolute;top:24px;left:24px;display:flex;gap:6px;opacity:.75}
.states button{font:inherit;font-size:13px;padding:6px 12px;border-radius:14px;border:1px solid #fff3;background:#0008;color:var(--on);cursor:pointer}
.states button[aria-pressed=true]{background:var(--accent);color:#0f1417}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main data-s="idle" id="lock" aria-label="Lock screen">
<div class="wall" aria-hidden="true"></div><div class="scrim" aria-hidden="true"></div>
<nav class="states" aria-label="Preview state">
 <button aria-pressed="true" data-v="idle">Idle</button><button aria-pressed="false" data-v="typing">Typing</button><button aria-pressed="false" data-v="wrong">Wrong</button><button aria-pressed="false" data-v="caps">Caps Lock</button>
</nav>
<aside class="status" aria-label="System status">
 <span>Wi-Fi <b>Home</b></span><span>Battery <b>82%</b></span><span>Layout <b>us</b></span>
</aside>
<section class="block">
 <p class="time">10:42</p>
 <p class="date">Saturday, <span>November 14</span></p>
 <p class="sub">3 notifications while you were away</p>
 <div class="row"><div class="field" role="textbox" aria-label="Password"><span class="ph">Password</span></div><span class="who">alejandro</span></div>
 <p class="hint" role="status"></p>
</section>
<aside class="media" aria-label="Now playing"><div class="art" aria-hidden="true"></div><div><p class="t">Says</p><p class="a">Nils Frahm · Spaces</p></div></aside>
</main>
<script>
const m=document.getElementById('lock'),f=m.querySelector('.field'),h=m.querySelector('.hint');
const R={idle:['<span class="ph">Password</span>',''],typing:['<i class="dot"></i>'.repeat(8),''],wrong:['<span class="ph">Password</span>','Wrong password — attempt 2'],caps:['<i class="dot"></i>'.repeat(3),'Caps Lock is on']};
document.querySelectorAll('.states button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.states button').forEach(x=>x.setAttribute('aria-pressed',x===b));m.dataset.s=b.dataset.v;[f.innerHTML,h.textContent]=R[b.dataset.v]});
</script></body></html>
